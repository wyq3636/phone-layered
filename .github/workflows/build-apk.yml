name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Capacitor CLI and Plugins
      run: npm install @capacitor/cli @capacitor/android @capacitor/core @capacitor/filesystem @capacitor/share

    - name: Add Android platform
      run: npx cap add android

    - name: Sync web assets to Android
      run: npx cap sync android

    - name: Configure Android permissions
      run: |
        # Add storage permission for file export
        sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />|' android/app/src/main/AndroidManifest.xml
        # Add requestLegacyExternalStorage for Android 10 compatibility
        sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' android/app/src/main/AndroidManifest.xml

    - name: Generate App Icons
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
        # Generate launcher icons from SVG
        for size in 48 72 96 144 192; do
          rsvg-convert -w $size -h $size icon.svg -o icon_${size}.png
        done
        # Create necessary mipmap directories
        for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          mkdir -p android/app/src/main/res/$dir
        done
        # Copy icons to the right places (ic_launcher + ic_launcher_round + ic_launcher_foreground)
        cp icon_48.png  android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        cp icon_48.png  android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
        cp icon_48.png  android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
        cp icon_72.png  android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp icon_72.png  android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
        cp icon_72.png  android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
        cp icon_96.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp icon_96.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
        cp icon_96.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
        cp icon_144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        cp icon_144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
        cp icon_144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
        cp icon_192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        cp icon_192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
        cp icon_192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
        echo "Icons generated and placed"

    - name: Build Debug APK
      working-directory: android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Build Release APK (unsigned)
      working-directory: android
      run: ./gradlew assembleRelease
      continue-on-error: true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: 成书笔记-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: 成书笔记-release
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: warn
      continue-on-error: true
