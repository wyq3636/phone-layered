<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EDE0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#1A1A2E"/>

  <!-- Open book - left page -->
  <path d="M60 140 L250 160 L250 420 L60 400 Z" fill="#F5F0E0" stroke="#DDD" stroke-width="3"/>
  <!-- Right page -->
  <path d="M452 140 L262 160 L262 420 L452 400 Z" fill="#FFFEF8" stroke="#DDD" stroke-width="3"/>
  <!-- Spine -->
  <line x1="256" y1="162" x2="256" y2="420" stroke="#CCC" stroke-width="3"/>

  <!-- Text lines on left page -->
  <line x1="90" y1="200" x2="230" y2="210" stroke="#CCC" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="240" x2="230" y2="250" stroke="#CCC" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="280" x2="230" y2="290" stroke="#CCC" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="320" x2="190" y2="328" stroke="#CCC" stroke-width="4" stroke-linecap="round"/>

  <!-- Text lines on right page -->
  <line x1="280" y1="210" x2="420" y2="200" stroke="#EEE" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="250" x2="420" y2="240" stroke="#EEE" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="290" x2="420" y2="280" stroke="#EEE" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="330" x2="380" y2="326" stroke="#EEE" stroke-width="4" stroke-linecap="round"/>

  <!-- Golden pen -->
  <path d="M370 120 L385 70 L400 120 Z" fill="url(#gold)" stroke="#C8A200" stroke-width="2"/>
  <!-- Pen body -->
  <line x1="390" y1="125" x2="380" y2="380" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
  <!-- Pen nib -->
  <path d="M378 380 Q395 378 393 396 Q390 408 376 404 Z" fill="url(#gold)"/>

  <!-- Sparkles -->
  <text x="430" y="320" font-size="36" fill="#FFD700" opacity="0.6">✦</text>
  <text x="465" y="360" font-size="24" fill="#FFD700" opacity="0.4">✦</text>

  <!-- Branding text -->
  <text x="256" y="485" text-anchor="middle" font-size="26" font-family="serif" fill="#FFD700" opacity="0.7" font-style="italic">✍ 成书笔记</text>
</svg>
