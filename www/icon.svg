<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 主背景渐变：深紫到蓝紫 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#2D1B69"/>
    </linearGradient>
    <!-- 卡片渐变：白色到淡紫 -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F0FF"/>
    </linearGradient>
    <!-- 金色渐变 -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- 彩虹线条渐变1 -->
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- 彩虹线条渐变2 -->
    <linearGradient id="line2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <!-- 光晕效果 -->
    <radialGradient id="glow" cx="70%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0"/>
    </radialGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.4"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5B21B6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <!-- 光晕叠加 -->
  <rect width="512" height="512" rx="115" fill="url(#glow)"/>

  <!-- 装饰圆圈（右上角） -->
  <circle cx="410" cy="105" r="60" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.3"/>
  <circle cx="410" cy="105" r="38" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.2"/>

  <!-- 装饰圆点 -->
  <circle cx="88" cy="82" r="8" fill="#C4B5FD" opacity="0.5"/>
  <circle cx="438" cy="440" r="12" fill="#A78BFA" opacity="0.3"/>
  <circle cx="72" cy="410" r="6" fill="#DDD6FE" opacity="0.4"/>

  <!-- 主卡片（后面一张，略倾斜） -->
  <rect x="138" y="138" width="236" height="290" rx="20"
        fill="white" opacity="0.15" transform="rotate(-4 256 283)"/>

  <!-- 主卡片（前面主体） -->
  <rect x="118" y="118" width="276" height="310" rx="22"
        fill="url(#cardGrad)" filter="url(#cardShadow)"/>

  <!-- 卡片顶部彩色条 -->
  <rect x="118" y="118" width="276" height="8" rx="0" fill="url(#goldGrad)" opacity="0.9"/>
  <rect x="118" y="118" width="276" height="8" rx="22"/>
  <!-- 圆角处理顶部 -->
  <path d="M118 126 Q118 118 140 118 L372 118 Q394 118 394 126 Z" fill="url(#goldGrad)"/>

  <!-- 分层便签标签（三个层叠的小标签） -->
  <rect x="148" y="155" width="8" height="50" rx="4" fill="#7C3AED" opacity="0.7"/>
  <rect x="162" y="160" width="8" height="45" rx="4" fill="#9F67FA" opacity="0.5"/>
  <rect x="176" y="165" width="8" height="40" rx="4" fill="#C4B5FD" opacity="0.3"/>

  <!-- 文字行 1（标题行） -->
  <rect x="200" y="163" width="160" height="14" rx="7" fill="url(#line1)"/>

  <!-- 文字行 2-5（内容行） -->
  <rect x="148" y="215" width="220" height="9" rx="4.5" fill="#DDD6FE"/>
  <rect x="148" y="236" width="200" height="9" rx="4.5" fill="#E5E7EB"/>
  <rect x="148" y="257" width="180" height="9" rx="4.5" fill="#E5E7EB"/>
  <rect x="148" y="278" width="140" height="9" rx="4.5" fill="#DDD6FE" opacity="0.7"/>

  <!-- 分割线 -->
  <line x1="148" y1="302" x2="366" y2="302" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 第二张便签预览 -->
  <rect x="148" y="316" width="220" height="9" rx="4.5" fill="#E5E7EB"/>
  <rect x="148" y="337" width="170" height="9" rx="4.5" fill="#E5E7EB" opacity="0.7"/>
  <rect x="148" y="358" width="130" height="9" rx="4.5" fill="#DDD6FE" opacity="0.6"/>

  <!-- 右下角金色圆形按钮（代表新建功能） -->
  <circle cx="350" cy="395" r="30" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="350" y="404" text-anchor="middle" font-size="30" fill="white" font-weight="bold">+</text>

  <!-- 右上角书签图标 -->
  <path d="M358 125 L376 125 L376 168 L367 158 L358 168 Z" fill="url(#goldGrad)"/>

  <!-- 底部文字 -->
  <text x="256" y="478" text-anchor="middle"
        font-size="30" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        fill="white" opacity="0.92" letter-spacing="2">成书笔记</text>
</svg>
